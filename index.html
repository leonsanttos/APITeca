<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APITeca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Menu Lateral -->
    <aside class="sidebar">
      <h2>Assistente</h2>
      <nav>
        <button class="nav-btn active" data-tool="conselho">Conselho do Dia</button>
        <button class="nav-btn" data-tool="cotacao">Cotação Moedas</button>
        <button class="nav-btn" data-tool="clima">Previsão Clima</button>
      </nav>
    </aside>

   
    <main class="content">
      
      <!-- Conselho -->
      <section id="tool-conselho" class="tool-card active">
        <h3>Conselho do Dia</h3>
        <p id="conselho-texto">Clique no botão para buscar um conselho...</p>
        <button id="btn-conselho">Buscar Conselho</button>
      </section>

      <!-- Cotação -->
      <section id="tool-cotacao" class="tool-card hidden">
        <h3>Cotação de Moedas</h3>
        <p>Em breve...</p>
      </section>

      <!-- Clima -->
      <section id="tool-clima" class="tool-card hidden">
        <h3>Previsão do Clima</h3>
        <p>Em breve...</p>
      </section>

    </main>
  </div>

  <!-- ATENÇÃO: type="module" é obrigatório aqui! -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
